<?xml version="1.0" encoding="UTF-8"?>
<svg id="_图层_1" data-name="图层 1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32">
  <defs>
    <style>
      .cls-1, .cls-2 {
        fill: none;
      }

      .cls-2 {
        stroke: #fff;
        stroke-miterlimit: 10;
        stroke-width: 1.25px;
      }

      .cls-3 {
        clip-path: url(#clippath-1);
      }

      .cls-4 {
        clip-path: url(#clippath);
      }
    </style>
    <clipPath id="clippath">
      <rect class="cls-1" x="5" y="5" width="22" height="22" rx="11" ry="11"/>
    </clipPath>
    <clipPath id="clippath-1">
      <rect class="cls-1" width="32" height="32"/>
    </clipPath>
  </defs>
  <g class="cls-4">
    <g class="cls-3">
      <image width="67" height="67" transform="scale(.48)" xlink:href="data:image/png;base64,"/>
    </g>
  </g>
  <rect class="cls-2" x="5" y="5" width="22" height="22" rx="11" ry="11"/>
</svg>